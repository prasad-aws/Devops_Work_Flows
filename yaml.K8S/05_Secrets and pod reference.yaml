apiVersion: v1
kind: Secret
metadata:
  name: pod-secret
  namespace: xius-dev
type: Opaque

# Data should be Base64 encoded
data:
  username: "YWRtaW4K"
  password: "YWRtaW4xMjMK"

# Validate the YAML
kubectl apply --dry-run=client -f 05_secret.yaml

# Create the Secret
kubectl apply -f 05_secret.yaml

# Check the Secret
kubectl get secrets -n xius-dev

# Check the specific Secret
kubectl get secret pod-secret -n xius-dev

# Check Secret with more details
kubectl describe secret pod-secret -n xius-dev

# Display the Secret in YAML format
kubectl get secret pod-secret -n xius-dev -o yaml

# Decode the username
kubectl get secret pod-secret -n xius-dev \
  -o jsonpath='{.data.username}' | base64 --decode

# Decode the password
kubectl get secret pod-secret -n xius-dev \
  -o jsonpath='{.data.password}' | base64 --decode

# Delete the Secret
kubectl delete secret pod-secret -n xius-dev

---

apiVersion: v1
kind: Pod
metadata:
  name: secrets-demo
  namespace: xius-dev
spec:
  containers:
  - name: nginx
    image: nginx
    envFrom:
    - secretRef:
        name: pod-secret

# Validate the YAML
kubectl apply --dry-run=client -f 06_secrets_demo.yaml

# Create the Pod
kubectl apply -f 06_secrets_demo.yaml

# Check the Pod
kubectl get pods -n xius-dev

# Check the Pod with more details
kubectl get pod secrets-demo -n xius-dev -o wide

# Describe the Pod
kubectl describe pod secrets-demo -n xius-dev

# Check the Secret reference
kubectl get pod secrets-demo -n xius-dev -o yaml

# Enter the nginx container
kubectl exec -it secrets-demo -n xius-dev -- /bin/bash

# Check the username environment variable
kubectl exec secrets-demo -n xius-dev -- printenv username

# Check the password environment variable
kubectl exec secrets-demo -n xius-dev -- printenv password

# Display all environment variables
kubectl exec secrets-demo -n xius-dev -- env

# Delete the Pod
kubectl delete pod secrets-demo -n xius-dev
