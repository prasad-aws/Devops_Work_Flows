apiVersion: v1
kind: Namespace
metadata:
  name: xius-dev
  labels:
    environment: development
    project: xyz


# Validate the YAML
kubectl apply --dry-run=client -f 01_namespace.yaml

# Create the Namespace
kubectl apply -f 01_namespace.yaml

# Check the Namespace
kubectl get namespaces

# Check the specific Namespace
kubectl get namespace xius-dev

# Check Namespace with labels
kubectl get namespace xius-dev --show-labels

# Describe the Namespace
kubectl describe namespace xius-dev

# Check Namespace in YAML format
kubectl get namespace xius-dev -o yaml
